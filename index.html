* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* feuille de saisie */

.sheet { background: var(--card); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 14px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

.recov { font: 700 1.6rem/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; background: var(--soft); border-radius: 12px; padding: 14px; text-align: center; margin: 10px 0; user-select: all; }

/* fiche parents */

@media (max-width: 759px) {

  .side { position: sticky; top: auto; bottom: 0; max-height: none; z-index: 16; box-shadow: 0 -4px 14px rgba(0,0,0,.1); }

  .wrap { padding: 0; max-width: none; }

}

/* =========================================================

/* ---------- Chiffrement ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function toB64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

const normRecovery = (s) => String(s).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');

/* ---------- Session ---------- */
let S = null, DK = null, RAW = null; // état déchiffré, clé de données, clé brute (seulement quand c'est ouvert)

const hasKeys = () => !!ls.get(LS_KEYS);
const getKeys = () => { try { return JSON.parse(ls.get(LS_KEYS)); } catch (e) { return null; } };
async function persist() {
  if (!DK || !S) return;
  const o = await aesEnc(DK, te.encode(JSON.stringify(S)));
  if (!ls.set(LS_DATA, JSON.stringify(o))) toast('⚠ La mémoire de l\'appareil est pleine : fais une sauvegarde puis efface les anciennes remarques.');
}
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { saveT = null; persist(); }, 200); }
async function flush() { if (saveT) { clearTimeout(saveT); saveT = null; await persist(); } }
async function openWith(raw) {
  RAW = raw; DK = await importDK(raw);

function defaultState() {

    v: 1, created: Date.now(), classes: [], rooms: [], plans: {}, events: [], done: [], lastBackup: 0,
    motifs: DEFAULT_MOTIFS.map((m) => ({ ...m })),

}
function migrate(s) {
  const d = defaultState();

  s.settings = { ...d.settings, ...s.settings };
  for (const r of s.rooms) migrateRoom(r, s.plans);
  for (const c of s.classes) { c.sep = c.sep || []; for (const t of c.students) { t.amenM = t.amenM || []; } }
}
const cls = (id) => S.classes.find((c) => c.id === id);
const motif = (id) => S.motifs.find((m) => m.id === id) || { id, label: '(motif supprimé)', icon: '•', kind: 'neg' };
const amenableIds = () => S.motifs.filter((m) => m.kind === 'neg' && m.amen && !m.hidden).map((m) => m.id);
const isAmenEvent = (stu, e) => !!stu.amen && stu.amenM.includes(e.m);
function lastDone(sid, type) { let t = 0; for (const d of S.done) if (d.s === sid && d.type === type && d.t > t) t = d.t; return t; }
function status(stu, now = Date.now()) {
  const evs = S.events.filter((e) => e.s === stu.id);
  const dn = lastDone(stu.id, 'neg'), dp = lastDone(stu.id, 'pos'), ws = weekStart(now);
  const kind = (e) => motif(e.m).kind;
  const negCounted = evs.filter((e) => kind(e) === 'neg' && e.t >= ws && e.t > dn && !isAmenEvent(stu, e));
  const graves = evs.filter((e) => kind(e) === 'grave' && e.t > dn && e.t > now - 30 * DAY);
  const posCounted = evs.filter((e) => kind(e) === 'pos' && e.t >= now - S.settings.posDays * DAY && e.t > dp);
  const posTh = stu.amen ? S.settings.posAmen : S.settings.pos;
  const lastPos = evs.reduce((m, e) => (kind(e) === 'pos' && e.t > m ? e.t : m), 0);
  const lastAny = evs.reduce((m, e) => Math.max(m, e.t), 0);
  return {
    negCounted, graves, posCounted, posTh, lastAny,
    negAlert: negCounted.length >= S.settings.neg || graves.length > 0,
    posAlert: posCounted.length >= posTh,
    valor: !!stu.amen && now - Math.max(lastPos, stu.since || 0) > S.settings.valorDays * DAY,

}
function classAlerts(c) { let neg = 0, pos = 0; for (const t of c.students) { const s = status(t); if (s.negAlert) neg++; if (s.posAlert) pos++; } return { neg, pos }; }

/* ---------- Salles : des tables posées librement ----------
   Une salle = des tables (1 unité = 1 place), un bureau ; le tableau est en haut.
   Les places d'une table s'appellent « idTable:numéro » : les élèves suivent leur table quand on la déplace. */
const TEMPLATES = {
  rows: { label: 'Rangées', fields: [['rows', 'Rangées', 1, 12, 5], ['tables', 'Tables par rangée', 1, 8, 3], ['places', 'Places par table', 1, 4, 2]],
    make: (p) => { const T = []; for (let r = 0; r < p.rows; r++) for (let t = 0; t < p.tables; t++) T.push({ id: `r${r}t${t}`, x: 0.5 + t * (p.places + 1), y: 2 + r * 1.5, n: p.places, cols: p.places, rot: 0 }); return T; } },
  islands: { label: 'Îlots', fields: [['islands', 'Îlots', 1, 12, 6], ['size', 'Places par îlot', 2, 8, 4], ['perRow', 'Îlots par ligne', 1, 6, 3]],
    make: (p) => { const T = [], h = Math.ceil(p.size / 2); for (let i = 0; i < p.islands; i++) T.push({ id: `i${i}`, x: 0.5 + (i % p.perRow) * 3.5, y: 2 + Math.floor(i / p.perRow) * (h + 1.2), n: p.size, cols: 2, rot: 0 }); return T; } },
  u: { label: 'En U', fields: [['left', 'Places côté gauche', 0, 16, 6], ['back', 'Places au fond', 0, 20, 8], ['right', 'Places côté droit', 0, 16, 6]],
    make: (p) => {
      const T = [], half = (n) => Math.ceil(n / 2), L = half(p.left), R = half(p.right), B = half(p.back), Hs = Math.max(L, R) * 2;
      for (let i = 0; i < L; i++) T.push({ id: `uL${i}`, x: 0.5, y: 2 + i * 2, n: Math.min(2, p.left - 2 * i), cols: 2, rot: 1 });
      for (let i = 0; i < B; i++) T.push({ id: `uB${i}`, x: 2 + i * 2, y: 2.5 + Hs, n: Math.min(2, p.back - 2 * i), cols: 2, rot: 0 });
      for (let i = 0; i < R; i++) T.push({ id: `uR${i}`, x: 2.5 + B * 2, y: 2 + i * 2, n: Math.min(2, p.right - 2 * i), cols: 2, rot: 1 });
      return T;
    } },
  empty: { label: 'Salle vide', fields: [], make: () => [] },
};
const tplDefaults = (k) => Object.fromEntries(TEMPLATES[k].fields.map((f) => [f[0], f[4]]));
function tableDims(t) { const cols = Math.max(1, Math.min(t.cols, t.n)), rows = Math.ceil(t.n / cols); return t.rot ? { w: rows, h: cols, cols, rows } : { w: cols, h: rows, cols, rows }; }
function tableSeats(t) {
  const d = tableDims(t), out = [];
  for (let k = 0; k < t.n; k++) { const c = k % d.cols, r = Math.floor(k / d.cols), rx = t.rot ? r : c, ry = t.rot ? c : r; out.push({ id: `${t.id}:${k}`, x: t.x + rx, y: t.y + ry, rx, ry, g: t.id }); }
  return out;
}
const roomSeats = (room) => room.tables.flatMap(tableSeats);
function roomBox(room) {
  let W = 8, H = 5;
  for (const t of room.tables) { const d = tableDims(t); W = Math.max(W, t.x + d.w + 0.5); H = Math.max(H, t.y + d.h + 0.5); }
  if (room.desk) { W = Math.max(W, room.desk.x + 2.5); H = Math.max(H, room.desk.y + 1.5); }
  return { W: Math.ceil(W * 2) / 2, H: Math.ceil(H * 2) / 2 };
}
function newRoom(name, tpl, p) {
  const r = { id: uid(), name, tables: TEMPLATES[tpl].make(p), desk: null };
  r.desk = { x: Math.max(0, Math.round(roomBox(r).W / 2 - 1)), y: 0.3 };
  return r;
}
function migrateRoom(r, plans) {
  if (r.tables) return;
  const tpl = r.type === 'islands' ? 'islands' : r.type === 'u' ? 'u' : 'rows';
  r.tables = TEMPLATES[tpl].make({ ...tplDefaults(tpl), ...(r.p || {}) });
  r.desk = { x: Math.max(0, Math.round(roomBox(r).W / 2 - 1)), y: 0.3 };
  for (const k of Object.keys(plans)) if (k.endsWith('|' + r.id)) {
    const nw = {};
    for (const [seat, sid] of Object.entries(plans[k])) { const m = seat.match(/^(r\d+t\d+|i\d+)p(\d+)$/); if (m) nw[`${m[1]}:${m[2]}`] = sid; }
    plans[k] = nw;
  }

}
const tRect = (t) => { const d = tableDims(t); return { x: t.x, y: t.y, w: d.w, h: d.h }; };
const hit = (a, b) => a.x < b.x + b.w - 0.01 && b.x < a.x + a.w - 0.01 && a.y < b.y + b.h - 0.01 && b.y < a.y + a.h - 0.01;

const adjacent = (a, b) => a.g === b.g || Math.hypot(a.x - b.x, a.y - b.y) < 1.1;
const planKey = (c, r) => c.id + '|' + r.id;
function seatOf(plan, sid) { return Object.keys(plan).find((k) => plan[k] === sid); }
function placeStudent(plan, sid, seatId) {
  const prev = seatOf(plan, sid), other = plan[seatId];
  if (prev === seatId) return;
  if (prev) delete plan[prev];
  if (other && other !== sid) { if (prev) plan[prev] = other; }
  plan[seatId] = sid;
}
function autoPlace(c, room, { amenFront, sep }) {
  const seats = roomSeats(room);
  const desk = room.desk ? room.desk.x + 1 : roomBox(room).W / 2;
  const front = seats.slice().sort((a, b) => a.y - b.y || Math.abs(a.x + 0.5 - desk) - Math.abs(b.x + 0.5 - desk));
  let best = {}, bestBad = Infinity;
  for (let tries = 0; tries < 400 && bestBad > 0; tries++) {
    const studs = shuffle(c.students.slice());
    const first = amenFront ? studs.filter((t) => t.amen) : [];
    const order = [...first, ...studs.filter((t) => !first.includes(t))];
    const plan = {}, pos = {};
    order.forEach((t, i) => { if (i < front.length) { plan[front[i].id] = t.id; pos[t.id] = front[i]; } });
    let bad = 0;
    if (sep) for (const [a, b] of c.sep) if (pos[a] && pos[b] && adjacent(pos[a], pos[b])) bad++;
    if (bad < bestBad) { bestBad = bad; best = plan; }
    if (!sep || !c.sep.length) break;

/** Taille d'une place en pixels, pour que la salle tienne dans l'écran (avec défilement sur petit écran) */
function unitFor(W, side) { const avail = Math.min(document.documentElement.clientWidth, 1100) - 32 - (side ? 248 : 0); return Math.max(50, Math.min(96, Math.floor(avail / W))); }
const vUnit = (u) => Math.round(u * 0.74);
/** Dessin de la salle ; seat(s, style) renvoie le HTML d'une place */
function roomHTML(room, { u, seat, editTables = false, selT = null }) {
  const flip = S.settings.view === 'desk';
  const { W, H } = roomBox(room), v = vUnit(u), off = 30;
  const X = (x, w) => (flip ? W - x - w : x) * u, Y = (y, h) => (flip ? H - y - h : y) * v + (flip ? 0 : off);
  let h = `<div class="room${editTables ? ' et' : ''}" style="width:${W * u}px;height:${H * v + off}px"><div class="board2" style="${flip ? 'bottom' : 'top'}:0">${flip ? '▼' : '▲'} Tableau ${flip ? '▼' : '▲'}</div>`;
  if (room.desk) h += `<div class="desk" id="desk" style="left:${X(room.desk.x, 2)}px;top:${Y(room.desk.y, 1)}px;width:${2 * u}px;height:${v}px">Bureau</div>`;
  for (const t of room.tables) {
    const d = tableDims(t);
    h += `<div class="tbl${selT === t.id ? ' sel' : ''}" data-t="${t.id}" style="left:${X(t.x, d.w)}px;top:${Y(t.y, d.h)}px;width:${d.w * u}px;height:${d.h * v}px">`;
    for (const s of tableSeats(t)) { const rx = flip ? d.w - 1 - s.rx : s.rx, ry = flip ? d.h - 1 - s.ry : s.ry; h += seat(s, `left:${rx * u}px;top:${ry * v}px;width:${u}px;height:${v}px`); }
    h += '</div>';

/* ---------- Éditeur de salle (tables et bureau) ---------- */

function dropRoomSeats(room, keep) {
  for (const k of Object.keys(S.plans)) if (k.endsWith('|' + room.id)) for (const sid of Object.keys(S.plans[k])) if (!keep.has(sid)) delete S.plans[k][sid];
}
function bindTablesEditor(room) {
  const flip = S.settings.view === 'desk', u = unitFor(roomBox(room).W, false), v = vUnit(u);
  const snap = (x) => Math.max(0, Math.round(x * 2) / 2);
  const here = view.name;
  app.onpointerdown = (e) => {
    if (view.name !== here) { app.onpointerdown = null; return; }
    const el = e.target.closest('.room.et [data-t], .room.et #desk'); if (!el) return;
    const obj = el.id === 'desk' ? room.desk : room.tables.find((t) => t.id === el.dataset.t); if (!obj) return;
    const oid = el.id === 'desk' ? 'desk' : obj.id, dims = el.id === 'desk' ? { w: 2, h: 1 } : tableDims(obj);
    const sx = e.clientX, sy = e.clientY, ox = obj.x, oy = obj.y, l0 = parseFloat(el.style.left), t0 = parseFloat(el.style.top), k = flip ? -1 : 1;

      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);

        if (overlapsAny(room, { x: nx, y: ny, w: dims.w, h: dims.h }, oid)) { toast('Il y a déjà une table à cet endroit.'); render(); return; }
        obj.x = nx; obj.y = ny; save(); render();

    const a = b.dataset.tb, line = t.cols >= t.n;

    else if (a === 'plus' && t.n < 8) { t.n++; if (line) t.cols = t.n; }

    else if (a === 'del') { room.tables = room.tables.filter((x) => x !== t); view.selT = null; }
    else if (a === 'close') view.selT = null;
    dropRoomSeats(room, new Set(roomSeats(room).map((s) => s.id)));
    save(); render();
    const cur = room.tables.find((x) => x.id === view.selT);
    if (cur && ['plus', 'rot', 'cols'].includes(a) && overlapsAny(room, tRect(cur), cur.id)) toast('Attention : cette table touche une autre table. Fais-la glisser un peu.');
  }; });
  $$('[data-add]').forEach((b) => { b.onclick = () => {
    const n = Number(b.dataset.add), cols = n <= 3 ? n : 2;

      <div class="row">${TEMPLATES[tpl].fields.map(([k, l, mi, ma, d]) => `<label>${l} <input type="number" data-f="${k}" min="${mi}" max="${ma}" value="${d}"></label>`).join('')}</div>`;

/* ---------- Petits composants ---------- */
const app = document.getElementById('app');
function bar(title, back) {

}
function mount(html, back) {
  app.innerHTML = html;
  const b = $('#b-back'); if (b && back) b.onclick = back;
  const l = $('#b-lock'); if (l) l.onclick = lock;
}
function go(v) { view = v; closeSheet(); render(); window.scrollTo(0, 0); }
let toastT = null;
function toast(msg, act, fn, ms = 6000) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button">${esc(act)}</button>` : ''}`;
  t.hidden = false;
  if (act) t.querySelector('button').onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
}
function hideToast() { $('#toast').hidden = true; }
function openSheet(html, bind) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('click', (e) => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  bind(o);
}
function closeSheet() { $('#overlay')?.remove(); }
async function copyText(txt, btn) {

  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) { /* rien */ } ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? '✔ Copié' : 'Copie impossible'; setTimeout(() => { btn.textContent = o; }, 1600); }
}
function badges(st) {
  const n = st.negCounted.length, p = st.posCounted.length;
  let h = '';
  if (st.graves.length) h += '<i class="d g" title="Fait grave">!</i>';
  if (n) h += `<i class="d n${Math.min(n, 3)}" title="Remarques cette semaine">${n}</i>`;
  if (p) h += `<i class="d p" title="Positifs">+${p}</i>`;
  if (st.valor) h += '<i class="d v" title="À valoriser">✨</i>';
  return h;
}
function alertCls(st) { return st.negAlert ? 'al-red' : st.negCounted.length === S.settings.neg - 1 && st.negCounted.length > 0 ? 'al-or' : st.posAlert ? 'al-pos' : ''; }

/* ---------- Rendu ---------- */

let clockT = null;
function renderLock() {
  const forgot = view.name === 'forgot';
  app.innerHTML = `<div class="lock">
    <div class="clock" id="clk"></div><div class="date" id="dt"></div>
    ${forgot ? `<div class="box" style="margin-top:30px"><h2>Code oublié</h2>

      <p class="small" id="fg-msg" style="color:var(--red)"></p>
      <div class="row"><button class="btn primary">Valider</button><button type="button" class="btn" id="fg-back">Retour</button></div></form></div>`
    : `<form class="lk" id="lk-form"><input type="password" id="lk-code" autocomplete="current-password" placeholder="Code" aria-label="Code"><button class="btn primary">Ouvrir</button></form>

      <button class="link small" id="lk-forgot">Code oublié ?</button>`}
  </div>`;
  const tick = () => { const d = new Date(); const c = $('#clk'); if (!c) { clearInterval(clockT); return; } c.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; const l = dLong(d); $('#dt').textContent = l.charAt(0).toUpperCase() + l.slice(1); };
  tick(); clearInterval(clockT); clockT = setInterval(tick, 10000);
  if (forgot) {
    $('#fg-back').onclick = () => { view = { name: 'home' }; render(); };
    $('#fg-form').onsubmit = async (e) => {
      e.preventDefault();
      const m = $('#fg-msg'), c1 = $('#fg-c1').value.trim();
      if (c1.length < 6) { m.textContent = 'Le nouveau code doit faire au moins 6 caractères.'; return; }
      if (c1 !== $('#fg-c2').value.trim()) { m.textContent = 'Les deux codes ne sont pas identiques.'; return; }
      m.textContent = 'Vérification…';
      const keys = getKeys(); let raw;
      try { raw = await unwrapWith(normRecovery($('#fg-rec').value), keys.w2); } catch (_) { m.textContent = 'Ce code de secours ne correspond pas.'; return; }
      keys.w1 = await wrapWith(c1, raw); ls.set(LS_KEYS, JSON.stringify(keys));
      await openWith(raw); view = { name: 'home' }; render(); toast('Nouveau code enregistré.');
    };
    return;
  }
  $('#lk-forgot').onclick = () => { view = { name: 'forgot' }; render(); };
  $('#lk-form').onsubmit = async (e) => {
    e.preventDefault();
    const m = $('#lk-msg');
    let tr = {}; try { tr = JSON.parse(ls.get(LS_TRY) || '{}'); } catch (_) { /* rien */ }
    if (tr.until && Date.now() < tr.until) { m.textContent = `Trop d'essais. Réessaie dans ${Math.ceil((tr.until - Date.now()) / 1000)} s.`; return; }
    const code = $('#lk-code').value.trim(); if (!code) return;
    m.textContent = '…';
    let raw;
    try { raw = await unwrapWith(code, getKeys().w1); } catch (_) {
      tr.n = (tr.n || 0) + 1;
      if (tr.n >= 5) tr.until = Date.now() + Math.min(600, 30 * 2 ** (tr.n - 5)) * 1000;
      ls.set(LS_TRY, JSON.stringify(tr));
      m.textContent = 'Code incorrect.'; $('#lk-code').value = ''; return;
    }
    ls.del(LS_TRY);
    try { await openWith(raw); } catch (err) { m.textContent = 'Impossible de lire les données de cet appareil (elles semblent abîmées).'; return; }
    view = { name: 'home' }; render();
  };

}

function bindPlanEdit(c, room) {
  const key = planKey(c, room);
  const plan = S.plans[key] || (S.plans[key] = {});
  let sel = null; // { s } ou { seat }
  const commit = () => { save(); render(); };
  const mark = () => { $$('.sel', app).forEach((e) => e.classList.remove('sel')); if (!sel) return; const el = sel.s ? (app.querySelector(`.seat[data-s="${sel.s}"]`) || app.querySelector(`.chip[data-s="${sel.s}"]`)) : app.querySelector(`.seat[data-seat="${sel.seat}"]`); el?.classList.add('sel'); };
  function tap(el) {
    if (!el) { sel = null; return mark(); }
    const T = { s: el.dataset.s || null, seat: el.dataset.seat || null, zone: el.id === 'unplaced' };
    if (!sel) { if (T.s) sel = { s: T.s }; else if (T.seat) sel = { seat: T.seat }; return mark(); }
    if (sel.s) {
      if (T.s === sel.s) { sel = null; return mark(); }
      if (T.seat) { placeStudent(plan, sel.s, T.seat); return commit(); }
      if (T.s && el.dataset.chip) { const sp = seatOf(plan, sel.s); if (sp) { placeStudent(plan, T.s, sp); return commit(); } sel = { s: T.s }; return mark(); }
      if (T.zone) { const sp = seatOf(plan, sel.s); if (sp) { delete plan[sp]; return commit(); } }
    } else if (sel.seat) {
      if (T.s) { placeStudent(plan, T.s, sel.seat); return commit(); }
      if (T.seat) { sel = T.seat === sel.seat ? null : { seat: T.seat }; return mark(); }
    }
    sel = null; mark();
  }
  const pick = (el) => el?.closest('[data-s], [data-seat], #unplaced');
  let drag = null;
  app.onpointerdown = onDown;
  function onDown(e) {
    if (view.name !== 'lesson' || view.edit !== 'eleves') { app.onpointerdown = null; return; }
    const el = pick(e.target); if (!el) return;
    drag = { el, sid: el.dataset.s, x: e.clientX, y: e.clientY, moving: false, ghost: null };
    document.addEventListener('pointermove', onMove, { passive: false }); document.addEventListener('pointerup', onUp, { once: true }); document.addEventListener('pointercancel', onCancel, { once: true });
  }
  function onMove(e) {
    if (!drag || !drag.sid) return;
    if (!drag.moving && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
      drag.moving = true;
      drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost';
      drag.ghost.textContent = c.students.find((t) => t.id === drag.sid)?.name || '';
      document.body.appendChild(drag.ghost);
    }
    if (drag.moving) { e.preventDefault(); drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
  }
  function onCancel() { document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); drag?.ghost?.remove(); drag = null; }
  function onUp(e) {
    document.removeEventListener('pointermove', onMove); document.removeEventListener('pointercancel', onCancel);
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moving) return tap(d.el);
    d.ghost.remove();
    const target = pick(document.elementFromPoint(e.clientX, e.clientY));
    if (target?.dataset.seat) { placeStudent(plan, d.sid, target.dataset.seat); return commit(); }
    if (target && (target.id === 'unplaced' || target.dataset.chip)) { const sp = seatOf(plan, d.sid); if (sp) { delete plan[sp]; return commit(); } }
  }
  $('#pe-clear').onclick = () => { if (confirm('Retirer tous les élèves de ce plan ?')) { S.plans[key] = {}; commit(); } };
  $('#pe-auto').onclick = () => {
    const nAm = c.students.filter((t) => t.amen).length;
    openSheet(`<div class="sheet-h"><div><b>Placement automatique</b><div class="small muted">Remplace le plan actuel de ${esc(c.name)} dans ${esc(room.name)}.</div></div><button class="ib" id="ap-x">✕</button></div>
      <label class="row"><input type="checkbox" id="ap-am" ${nAm ? 'checked' : 'disabled'}> Élèves avec aménagements devant ${nAm ? `(${nAm})` : '(aucun)'}</label>
      <label class="row"><input type="checkbox" id="ap-sep" ${c.sep.length ? 'checked' : 'disabled'}> Séparer les élèves à séparer ${c.sep.length ? `(${plural(c.sep.length, 'paire')})` : '(aucune paire : à régler dans 👥 la classe)'}</label>
      <p class="small muted">Les autres élèves sont placés au hasard, en remplissant de l'avant vers l'arrière.</p>
      <div class="row"><button class="btn primary" id="ap-go">🎲 Placer</button></div>`, (o) => {
      $('#ap-x', o).onclick = closeSheet;
      $('#ap-go', o).onclick = () => {
        const r = autoPlace(c, room, { amenFront: $('#ap-am', o).checked, sep: $('#ap-sep', o).checked });
        S.plans[key] = r.plan; closeSheet(); commit();
        toast(r.missing ? `⚠ Pas assez de places : ${plural(r.missing, 'élève')} non placé(s).` : r.bad ? `Placé, mais ${plural(r.bad, 'paire')} n'a pas pu être séparée.` : 'Plan créé. Tu peux encore échanger des élèves.');
      };
    });
  };
}

/* ----- Suivi de la classe ----- */
function edText(stu, type) {
  const st = status(stu);
  if (type === 'neg') {
    const parts = [];
    for (const e of st.graves) parts.push(`${motif(e.m).label.toLowerCase()} le ${dFull(e.t)} à ${hm(e.t)}${e.n ? ` (${e.n})` : ''}`);
    if (st.negCounted.length) parts.push(`${st.negCounted.length} remarques depuis lundi : ` + st.negCounted.map((e) => `${motif(e.m).label.toLowerCase()} le ${dShort(e.t)}${e.n ? ` (${e.n})` : ''}`).join(', '));
    return `${stu.name} : ${parts.join(' ; ')}.`;
  }
  return `${stu.name} : encouragements. ` + st.posCounted.map((e) => `${motif(e.m).label.toLowerCase()} le ${dShort(e.t)}${e.n ? ` (${e.n})` : ''}`).join(', ') + '.';
}
function markDone(stu, type) {
  S.done.push({ t: Date.now(), s: stu.id, type }); save();
  toast(type === 'neg' ? `Saisi pour ${stu.name} : son compteur repart de zéro.` : `Encouragement saisi pour ${stu.name}.`, 'Annuler', () => { S.done.pop(); save(); render(); });
  render();
}
function renderSuivi() {
  const c = cls(view.c); if (!c) return go({ name: 'home' });
  const now = Date.now(), ws = weekStart(now);
  const rows = c.students.map((t) => ({ t, st: status(t) }));
  const neg = rows.filter((r) => r.st.negAlert), pos = rows.filter((r) => r.st.posAlert);
  const valor = rows.filter((r) => r.st.valor);
  const invisible = (now - (c.created || 0) > S.settings.invisibleDays * DAY) ? rows.filter((r) => now - r.st.lastAny > S.settings.invisibleDays * DAY) : [];
  const wk = S.events.filter((e) => e.c === c.id && e.t >= ws);
  const wPos = wk.filter((e) => motif(e.m).kind === 'pos').length, wNeg = wk.length - wPos;
  const alertRow = (r, type) => `<div class="alert ${type === 'neg' ? 'red' : 'green'}"><div class="txt"><b>${esc(r.t.name)}</b> <span class="small muted">${type === 'neg' ? (r.st.graves.length ? `fait grave : ${r.st.graves.map((e) => esc(motif(e.m).label.toLowerCase())).join(', ')}` : '') + (r.st.graves.length && r.st.negCounted.length >= S.settings.neg ? ' · ' : '') + (r.st.negCounted.length >= S.settings.neg ? `${r.st.negCounted.length} remarques cette semaine` : '') : `${r.st.posCounted.length} positifs`}</span></div>
    <div class="acts"><button class="btn sm" data-copy="${r.t.id}" data-type="${type}">Copier le texte</button><button class="btn sm primary" data-done="${r.t.id}" data-type="${type}">✔ Saisi sur École Directe</button></div></div>`;
  let h = bar('Suivi · ' + esc(c.name), () => go({ name: 'lesson', c: c.id, r: c.lastRoom || '' })) + '<main class="wrap">';
  h += '<h2>🔴 Observations à saisir sur École Directe</h2>' + (neg.length ? neg.map((r) => alertRow(r, 'neg')).join('') : `<p class="muted small">Personne n'a atteint le palier (${S.settings.neg} remarques dans la semaine, ou un fait grave).</p>`);
  h += '<h2>🟢 Encouragements à saisir</h2>' + (pos.length ? pos.map((r) => alertRow(r, 'pos')).join('') : `<p class="muted small">Personne n'a encore atteint le palier (${S.settings.pos} positifs en ${S.settings.posDays} jours${c.students.some((t) => t.amen) ? `, ${S.settings.posAmen} avec aménagements` : ''}).</p>`);
  if (valor.length) h += `<h2>✨ À valoriser</h2><p class="small muted">Élèves avec aménagements sans positif depuis ${S.settings.valorDays} jours : cherche une occasion de les encourager.</p><div class="chips">${valor.map((r) => `<button class="chip" data-open="${r.t.id}">${esc(r.t.name)}</button>`).join('')}</div>`;
  if (invisible.length) h += `<h2>👀 Pas vus depuis ${S.settings.invisibleDays} jours</h2><p class="small muted">Ni positif ni remarque : ce sont souvent les élèves discrets.</p><div class="chips">${invisible.map((r) => `<button class="chip" data-open="${r.t.id}">${esc(r.t.name)}</button>`).join('')}</div>`;
  h += `<h2>Cette semaine</h2><div class="box"><b>${plural(wPos, 'positif')}</b> · <b>${plural(wNeg, 'remarque')}</b> (faits graves compris)<div class="balance">${wPos + wNeg ? `<i class="bp" style="width:${wPos / (wPos + wNeg) * 100}%"></i><i class="bn" style="width:${wNeg / (wPos + wNeg) * 100}%"></i>` : ''}</div><span class="small muted">Repère : viser nettement plus de positif que de remarques.</span></div>`;
  const sorted = rows.slice().sort((a, b) => (b.st.graves.length * 10 + b.st.negCounted.length) - (a.st.graves.length * 10 + a.st.negCounted.length) || a.t.name.localeCompare(b.t.name, 'fr'));
  h += `<div class="tw"><table class="t"><thead><tr><th>Élève</th><th>Remarques (semaine)</th><th>Positifs (${S.settings.posDays} j)</th><th></th></tr></thead><tbody>${sorted.map((r) => `<tr class="click" data-open="${r.t.id}"><td><b>${esc(r.t.name)}</b>${r.t.amen ? ' <span class="tag am">am.</span>' : ''}</td><td>${r.st.graves.length ? '<i class="d g">!</i> ' : ''}${r.st.negCounted.length} / ${S.settings.neg}</td><td>${r.st.posCounted.length} / ${r.st.posTh}</td><td>›</td></tr>`).join('')}</tbody></table></div>`;
  h += '</main>';
  mount(h, () => go({ name: 'lesson', c: c.id, r: c.lastRoom || '' }));
  const stu = (id) => c.students.find((t) => t.id === id);
  $$('[data-copy]').forEach((b) => { b.onclick = () => copyText(edText(stu(b.dataset.copy), b.dataset.type), b); });
  $$('[data-done]').forEach((b) => { b.onclick = () => markDone(stu(b.dataset.done), b.dataset.type); });
  $$('[data-open]').forEach((b) => { b.onclick = () => go({ name: 'eleve', c: c.id, s: b.dataset.open, back: { name: 'suivi', c: c.id } }); });
}

/* ----- Fiche élève ----- */
function renderEleve() {
  const c = cls(view.c), stu = c?.students.find((t) => t.id === view.s); if (!stu) return go({ name: 'home' });
  const back = () => go(view.back || { name: 'suivi', c: c.id });
  const st = status(stu), now = Date.now();
  const evs = S.events.filter((e) => e.s === stu.id).sort((a, b) => b.t - a.t);
  const done = S.done.filter((d) => d.s === stu.id);
  const ws = weekStart(now);
  const weeks = [...Array(8)].map((_, i) => { const a = ws - (7 - i) * 7 * DAY, b = a + 7 * DAY; const w = evs.filter((e) => e.t >= a && e.t < b); const p = w.filter((e) => motif(e.m).kind === 'pos').length; return { a, p, n: w.length - p }; });
  const mx = Math.max(1, ...weeks.map((w) => Math.max(w.p, w.n)));
  const per = view.per || 28;
  const inPer = evs.filter((e) => per === 'all' || e.t >= now - per * DAY);
  const counts = {}; for (const e of inPer) counts[e.m] = (counts[e.m] || 0) + 1;
  let h = bar(esc(stu.name) + ' · ' + esc(c.name), back) + '<main class="wrap">';
  h += `<div class="box">Cette semaine : <b>${st.negCounted.length} / ${S.settings.neg}</b> remarque(s) comptée(s) · <b>${st.posCounted.length} / ${st.posTh}</b> positif(s)${st.graves.length ? ' · <b style="color:var(--red)">fait grave</b>' : ''}
    ${st.negAlert || st.posAlert ? `<div class="row">${st.negAlert ? '<button class="btn sm" data-copy="neg">Copier l\'observation</button><button class="btn sm primary" data-done="neg">✔ Observation saisie</button>' : ''}${st.posAlert ? '<button class="btn sm" data-copy="pos">Copier l\'encouragement</button><button class="btn sm primary" data-done="pos">✔ Encouragement saisi</button>' : ''}</div>` : ''}</div>`;
  h += `<h2>8 dernières semaines</h2><div class="box"><div class="chart">${weeks.map((w) => `<div class="wk"><div class="bars"><i class="bp" style="height:${w.p / mx * 100}%" title="${w.p} positif(s)"></i><i class="bn" style="height:${w.n / mx * 100}%" title="${w.n} remarque(s)"></i></div><span class="lab">${dShort(w.a)}</span></div>`).join('')}</div><span class="small muted">■ <span style="color:var(--green)">positifs</span> · ■ <span style="color:var(--or)">remarques</span>, par semaine (lundi indiqué)</span></div>`;
  h += `<h2>Par motif <select id="e-per" class="small"><option value="28"${per === 28 ? ' selected' : ''}>4 dernières semaines</option><option value="56"${per === 56 ? ' selected' : ''}>8 dernières semaines</option><option value="all"${per === 'all' ? ' selected' : ''}>depuis le début</option></select></h2>`;
  h += Object.keys(counts).length ? `<div class="chips">${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<span class="chip">${motif(m).icon} ${esc(motif(m).label)} <b>${n}</b></span>`).join('')}</div>` : '<p class="muted small">Rien sur cette période.</p>';
  h += `<div class="row"><button class="btn primary" id="e-parents">📄 Fiche pour les parents</button></div>`;
  // aménagements
  const amIds = amenableIds();
  h += `<details class="box"${stu.amen ? ' open' : ''}><summary><b>Aménagements</b> <span class="small muted">(visible par toi seul, jamais sur la fiche parents)</span></summary>
    <label class="row"><input type="checkbox" id="e-amen"${stu.amen ? ' checked' : ''}> Cet élève a des aménagements (PAP, PPS…)</label>
    ${stu.amen ? `<p class="small">Motifs notés mais <b>non comptés</b> dans le palier :</p><div class="chips">${S.motifs.filter((m) => m.kind === 'neg' && !m.hidden).map((m) => `<label class="chip"><input type="checkbox" data-am="${m.id}"${stu.amenM.includes(m.id) ? ' checked' : ''}> ${m.icon} ${esc(m.label)}</label>`).join('')}</div>
    <p class="small muted">Palier positif abaissé à ${S.settings.posAmen}. Rappel « à valoriser » sans positif depuis ${S.settings.valorDays} jours.</p>` : `<p class="small muted">Par défaut, ces motifs ne compteront pas : ${amIds.map((id) => esc(motif(id).label.toLowerCase())).join(', ')}. Tu pourras ajuster.</p>`}
    <p class="small muted">À faire correspondre à ce qui est prévu dans son PAP ou PPS, en accord avec l'équipe. N'écris jamais de diagnostic.</p></details>`;
  // historique
  const items = [...evs.map((e) => ({ t: e.t, e })), ...done.map((d) => ({ t: d.t, d }))].sort((a, b) => b.t - a.t);
  h += `<h2>Historique</h2><ul class="hist">${items.map((it) => it.e ? `<li><span class="when">${dShort(it.e.t)} ${hm(it.e.t)}</span><span class="what">${motif(it.e.m).icon} ${esc(motif(it.e.m).label)}${isAmenEvent(stu, it.e) ? '<span class="tag am">non compté</span>' : ''}${it.e.n ? ` <span class="muted">— ${esc(it.e.n)}</span>` : ''}</span><button class="x" data-del="${it.e.id}" aria-label="Supprimer">✕</button></li>` : `<li class="done"><span class="when">${dShort(it.d.t)} ${hm(it.d.t)}</span><span class="what">✔ ${it.d.type === 'neg' ? 'Observation' : 'Encouragement'} saisi sur École Directe</span></li>`).join('') || '<li class="muted">Rien pour l\'instant.</li>'}</ul>`;
  h += '</main>';
  mount(h, back);
  $('#e-per').onchange = (e) => { view.per = e.target.value === 'all' ? 'all' : Number(e.target.value); render(); };
  $('#e-parents').onclick = () => go({ name: 'parents', c: c.id, s: stu.id, back: { ...view } });
  $('#e-amen').onchange = (e) => { stu.amen = e.target.checked; if (stu.amen) { if (!stu.amenM.length) stu.amenM = amenableIds(); stu.since = Date.now(); } save(); render(); };
  $$('[data-am]').forEach((b) => { b.onchange = () => { stu.amenM = $$('[data-am]').filter((x) => x.checked).map((x) => x.dataset.am); save(); }; });
  $$('[data-del]').forEach((b) => { b.onclick = () => { const e = S.events.find((x) => x.id === b.dataset.del); if (e && confirm(`Supprimer « ${motif(e.m).label} » du ${dShort(e.t)} ?`)) { S.events = S.events.filter((x) => x !== e); save(); render(); } }; });
  $$('[data-copy]').forEach((b) => { b.onclick = () => copyText(edText(stu, b.dataset.copy), b); });
  $$('[data-done]').forEach((b) => { b.onclick = () => markDone(stu, b.dataset.done); });
}

/* ----- Fiche pour les parents ----- */
function renderParents() {
  const c = cls(view.c), stu = c?.students.find((t) => t.id === view.s); if (!stu) return go({ name: 'home' });
  const back = () => go(view.back || { name: 'eleve', c: c.id, s: stu.id });
  const now = Date.now();
  const per = view.per || 28;
  const from = per === 'date' ? (view.from ? new Date(view.from + 'T00:00').getTime() : now - 28 * DAY) : per === 'all' ? 0 : now - per * DAY;
  const withAm = !!view.withAm;
  const evs = S.events.filter((e) => e.s === stu.id && e.t >= from && (withAm || !isAmenEvent(stu, e))).sort((a, b) => a.t - b.t);
  const pos = evs.filter((e) => motif(e.m).kind === 'pos'), neg = evs.filter((e) => motif(e.m).kind !== 'pos');
  const first = evs.length ? evs[0].t : from;
  const tab = (list, grave, none) => list.length ? `<table><thead><tr><th style="width:130px">Date</th><th>Motif</th><th>Précision</th></tr></thead><tbody>${list.map((e) => `<tr><td>${dFull(e.t)}${grave ? ` à ${hm(e.t)}` : ''}</td><td>${esc(motif(e.m).label)}${motif(e.m).kind === 'grave' ? ' <b>(fait grave)</b>' : ''}</td><td>${esc(e.n || '')}</td></tr>`).join('')}</tbody></table>` : `<p>${none}</p>`;
  let h = bar('Fiche parents · ' + esc(stu.name), back) + '<main class="wrap">';
  h += `<div class="noprint box"><div class="row"><label>Période : <select id="p-per"><option value="28"${per === 28 ? ' selected' : ''}>4 dernières semaines</option><option value="56"${per === 56 ? ' selected' : ''}>8 dernières semaines</option><option value="date"${per === 'date' ? ' selected' : ''}>depuis une date…</option><option value="all"${per === 'all' ? ' selected' : ''}>depuis le début</option></select></label>${per === 'date' ? `<input type="date" id="p-from" value="${esc(view.from || '')}">` : ''}</div>
    ${stu.amen ? `<label class="row small"><input type="checkbox" id="p-am"${withAm ? ' checked' : ''}> Inclure les remarques non comptées (aménagements)</label>` : ''}
    <div class="row"><button class="btn primary" id="p-print">🖨 Imprimer ou enregistrer en PDF</button></div>
    <p class="small muted">Tu peux aussi montrer cette page directement sur l'appareil : elle ne contient que cet élève.</p></div>`;
  h += `<div class="paper"><div class="ph"><span>${esc(S.settings.etab || '')}</span><span>Le ${dFull(now)}</span></div>
    <h2>Suivi en classe — ${esc(stu.name)} (${esc(c.name)})</h2>
    <div class="ph"><span>Période : du ${dFull(Math.max(from, first))} au ${dFull(now)}</span><span>${S.settings.prof ? 'Enseignant·e : ' + esc(S.settings.prof) : ''}</span></div>
    <h3>Points positifs (${pos.length})</h3>${tab(pos, false, 'Aucun.')}
    <h3>Remarques (${neg.length})</h3>${tab(neg, true, 'Aucune.')}
    <p class="pf">Faits notés en classe au fil des cours. Ce document ne concerne que votre enfant.</p></div>`;
  h += '</main>';
  mount(h, back);
  $('#p-per').onchange = (e) => { const v = e.target.value; view.per = v === 'all' || v === 'date' ? v : Number(v); render(); };
  $('#p-from')?.addEventListener('change', (e) => { view.from = e.target.value; render(); });
  $('#p-am')?.addEventListener('change', (e) => { view.withAm = e.target.checked; render(); });
  $('#p-print').onclick = () => { fileOpUntil = Date.now() + 120000; window.print(); };
}

/* ----- Classe : élèves, séparations ----- */
function parseNames(txt) { return txt.split(/[\n\r;]+|,(?=\s*\S)/).map((x) => x.replace(/\s+/g, ' ').trim()).filter(Boolean); }
function renderClasse() {
  if (!view.c) {
    let h = bar('Nouvelle classe', () => go({ name: 'home' })) + `<main class="wrap"><form id="nc"><label class="f"><span>Nom de la classe</span><input type="text" id="nc-name" placeholder="6e A, Pilates…" required></label>
      <label class="f"><span>Prénoms des élèves</span><textarea id="nc-list" rows="10" placeholder="Un prénom par ligne (tu peux coller une liste).&#10;Si deux élèves ont le même prénom, ajoute l'initiale du nom."></textarea></label>
      <button class="btn primary">Créer la classe</button></form></main>`;
    mount(h, () => go({ name: 'home' }));
    $('#nc').onsubmit = (e) => {
      e.preventDefault();
      const name = $('#nc-name').value.trim(); if (!name) return;
      const c = { id: uid(), name, created: Date.now(), students: parseNames($('#nc-list').value).map((n) => ({ id: uid(), name: n, amen: false, amenM: [] })), sep: [] };
      S.classes.push(c); save();
      go({ name: 'lesson', c: c.id, r: S.rooms[0]?.id || '' });
    };
    return;
  }
  const c = cls(view.c); if (!c) return go({ name: 'home' });
  const back = () => go({ name: 'lesson', c: c.id, r: c.lastRoom || S.rooms[0]?.id || '' });
  const studs = c.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const nm = (id) => c.students.find((t) => t.id === id)?.name || '?';
  let h = bar('Classe · ' + esc(c.name), back) + '<main class="wrap">';
  h += `<label class="f"><span>Nom de la classe</span><input type="text" id="c-name" value="${esc(c.name)}"></label>`;
  h += `<h2>Élèves (${c.students.length})</h2><div class="box">${studs.map((t) => `<div class="row" style="margin:4px 0"><input type="text" data-ren="${t.id}" value="${esc(t.name)}" style="flex:1"><button class="btn sm" data-fiche="${t.id}">Fiche</button><button class="btn sm danger" data-rm="${t.id}" aria-label="Retirer">✕</button></div>`).join('') || '<p class="muted small">Aucun élève.</p>'}
    <label class="f"><span>Ajouter des élèves</span><textarea id="c-add" rows="3" placeholder="Un prénom par ligne"></textarea></label><button class="btn" id="c-addb">Ajouter</button></div>`;
  h += `<h2>Élèves à séparer</h2><div class="box"><p class="small muted">Utilisé par le placement automatique.</p>${c.sep.map(([a, b], i) => `<div class="row" style="margin:4px 0"><span>${esc(nm(a))} ↔ ${esc(nm(b))}</span><button class="btn sm danger" data-sep="${i}">✕</button></div>`).join('')}
    <div class="row"><select id="s-a">${studs.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select> ↔ <select id="s-b">${studs.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn sm" id="s-add">Ajouter</button></div></div>`;
  h += `<h2>Supprimer</h2><button class="btn danger" id="c-del">Supprimer la classe et toutes ses remarques</button>`;
  h += '</main>';
  mount(h, back);
  $('#c-name').onchange = (e) => { const v = e.target.value.trim(); if (v) { c.name = v; save(); } };
  $$('[data-ren]').forEach((i) => { i.onchange = () => { const t = c.students.find((x) => x.id === i.dataset.ren); const v = i.value.trim(); if (t && v) { t.name = v; save(); } }; });
  $$('[data-fiche]').forEach((b) => { b.onclick = () => go({ name: 'eleve', c: c.id, s: b.dataset.fiche, back: { name: 'classe', c: c.id } }); });
  $$('[data-rm]').forEach((b) => { b.onclick = () => {
    const t = c.students.find((x) => x.id === b.dataset.rm); if (!t || !confirm(`Retirer ${t.name} de la classe ? Ses remarques seront effacées.`)) return;
    c.students = c.students.filter((x) => x !== t); S.events = S.events.filter((e) => e.s !== t.id); S.done = S.done.filter((d) => d.s !== t.id);
    c.sep = c.sep.filter((p) => !p.includes(t.id));
    for (const k of Object.keys(S.plans)) if (k.startsWith(c.id + '|')) { const sp = seatOf(S.plans[k], t.id); if (sp) delete S.plans[k][sp]; }
    save(); render();
  }; });
  $('#c-addb').onclick = () => { const names = parseNames($('#c-add').value); if (!names.length) return; for (const n of names) c.students.push({ id: uid(), name: n, amen: false, amenM: [] }); save(); render(); toast(`${plural(names.length, 'élève ajouté', 'élèves ajoutés')}.`); };
  $('#s-add').onclick = () => { const a = $('#s-a').value, b = $('#s-b').value; if (!a || !b || a === b || c.sep.some((p) => p.includes(a) && p.includes(b))) return; c.sep.push([a, b]); save(); render(); };
  $$('[data-sep]').forEach((b) => { b.onclick = () => { c.sep.splice(Number(b.dataset.sep), 1); save(); render(); }; });
  $('#c-del').onclick = () => {
    if (!confirm(`Supprimer la classe ${c.name}, ses plans et toutes ses remarques ?`)) return;
    const ids = new Set(c.students.map((t) => t.id));
    S.classes = S.classes.filter((x) => x !== c); S.events = S.events.filter((e) => !ids.has(e.s)); S.done = S.done.filter((d) => !ids.has(d.s));
    for (const k of Object.keys(S.plans)) if (k.startsWith(c.id + '|')) delete S.plans[k];
    save(); go({ name: 'home' });
  };
}

/* ----- Salles ----- */
function renderSalles() {
  let h = bar('Mes salles', () => go({ name: 'home' })) + '<main class="wrap">';
  h += S.rooms.length ? '<div class="cards">' + S.rooms.map((r) => `<button class="card" data-r="${r.id}"><b>${esc(r.name)}</b><span class="muted small">${plural(roomSeats(r).length, 'place')} · ${plural(r.tables.length, 'table')}</span></button>`).join('') + '</div>' : '<div class="empty">Aucune salle pour l\'instant.</div>';
  h += '<div class="row"><button class="btn primary" id="r-new">＋ Nouvelle salle</button></div><p class="small muted">Une salle sert à toutes tes classes : chaque classe a son propre plan dans chaque salle.</p></main>';
  mount(h, () => go({ name: 'home' }));
  $$('[data-r]').forEach((b) => { b.onclick = () => go({ name: 'salle', r: b.dataset.r }); });
  $('#r-new').onclick = () => go({ name: 'salle', r: null });
}
function renderSalle() {
  const room = S.rooms.find((r) => r.id === view.r);
  const back = () => go(view.back ? { ...view.back, r: room ? room.id : view.back.r } : { name: 'salles' });
  if (!room) {
    const tpl = view.tpl || 'rows';
    let h = bar('Nouvelle salle', back) + `<main class="wrap"><label class="f"><span>Nom</span><input type="text" id="r-name" value="${esc(view.rname || '')}" placeholder="B12, Labo…"></label>
      <p><b>Pour commencer</b> <span class="small muted">(ensuite tu déplaces chaque table comme tu veux)</span></p>
      <div class="row">${Object.entries(TEMPLATES).map(([k, x]) => `<label class="chip"><input type="radio" name="tp" value="${k}"${k === tpl ? ' checked' : ''}> ${x.label}</label>`).join('')}</div>
      <div class="row">${TEMPLATES[tpl].fields.map(([k, l, mi, ma, d]) => `<label>${l} <input type="number" data-f="${k}" min="${mi}" max="${ma}" value="${d}"></label>`).join('')}</div>
      <div class="row"><button class="btn primary" id="r-create">Créer et disposer les tables</button></div></main>`;
    mount(h, back);
    $('#r-name').oninput = (e) => { view.rname = e.target.value; };
    $$('input[name=tp]').forEach((r) => { r.onchange = () => { view.tpl = r.value; render(); }; });
    $('#r-create').onclick = () => {
      const p = { ...tplDefaults(tpl) }; $$('[data-f]').forEach((i) => { p[i.dataset.f] = Math.max(Number(i.min), Math.min(Number(i.max), Math.round(Number(i.value) || 0))); });
      const r = newRoom($('#r-name').value.trim() || 'Ma salle', tpl, p);
      S.rooms.push(r); save();
      go({ name: 'salle', r: r.id, back: view.back });
    };
    return;
  }
  let h = bar('Salle · ' + esc(room.name), back) + `<main class="wrap wide"><div class="row"><label>Nom <input type="text" id="r-name" value="${esc(room.name)}"></label><button class="btn sm primary" id="r-ok">✔ Terminé</button></div>`;
  h += tablesEditorHTML(room);
  h += '<div class="row"><button class="btn danger" id="r-del">Supprimer la salle</button></div></main>';
  mount(h, back);
  $('#r-name').onchange = (e) => { room.name = e.target.value.trim() || room.name; save(); };
  $('#r-ok').onclick = back;
  $('#r-del').onclick = () => {
    if (!confirm(`Supprimer la salle ${room.name} et les plans de classe qui vont avec ?`)) return;
    S.rooms = S.rooms.filter((r) => r !== room);
    for (const k of Object.keys(S.plans)) if (k.endsWith('|' + room.id)) delete S.plans[k];
    save(); go({ name: 'salles' });
  };
  bindTablesEditor(room);
}

/* ----- Motifs, paliers, fiche ----- */
function renderReglages() {
  const s = S.settings;
  const num = (k, min, max) => `<input type="number" data-set="${k}" min="${min}" max="${max}" value="${s[k]}">`;
  let h = bar('Motifs et paliers', () => go({ name: 'home' })) + '<main class="wrap">';
  h += `<h2>Paliers</h2><div class="box">
    <p>🔴 Observation à saisir dès ${num('neg', 1, 20)} remarques dans la semaine (remise à zéro le lundi), ou dès un fait grave.</p>
    <p>🟢 Encouragement à saisir dès ${num('pos', 1, 30)} positifs en ${num('posDays', 3, 60)} jours.</p>
    <p>Avec aménagements : encouragement dès ${num('posAmen', 1, 30)} positifs ; « à valoriser » sans positif depuis ${num('valorDays', 1, 30)} jours.</p>
    <p>👀 Élèves « pas vus » : rien depuis ${num('invisibleDays', 3, 60)} jours.</p></div>`;
  h += `<h2>Plan de classe</h2><div class="box"><label class="row"><input type="radio" name="vw" value="back"${s.view !== 'desk' ? ' checked' : ''}> Vu depuis le fond (tableau en haut)</label><label class="row"><input type="radio" name="vw" value="desk"${s.view === 'desk' ? ' checked' : ''}> Vu depuis le bureau (tableau en bas)</label></div>`;
  h += `<h2>Fiche parents</h2><div class="box"><label class="f"><span>Établissement</span><input type="text" data-txt="etab" value="${esc(s.etab)}" placeholder="Collège…"></label><label class="f"><span>Ton nom</span><input type="text" data-txt="prof" value="${esc(s.prof)}" placeholder="M. / Mme …"></label></div>`;
  h += '<h2>Motifs</h2>';
  for (const [k, t] of KINDS) {
    h += `<div class="box"><h3>${t}</h3>${S.motifs.filter((m) => m.kind === k && !m.hidden).map((m) => `<div class="row" style="margin:4px 0"><input type="text" data-icon="${m.id}" value="${esc(m.icon)}" style="width:52px;text-align:center"><input type="text" data-label="${m.id}" value="${esc(m.label)}" style="flex:1;min-width:140px">${k === 'neg' ? `<label class="small"><input type="checkbox" data-amen="${m.id}"${m.amen ? ' checked' : ''}> aménageable</label>` : ''}<button class="btn sm danger" data-hide="${m.id}" aria-label="Retirer">✕</button></div>`).join('')}
      <div class="row"><input type="text" data-newicon="${k}" placeholder="🙂" style="width:52px;text-align:center"><input type="text" data-newlabel="${k}" placeholder="Nouveau motif" style="flex:1;min-width:140px"><button class="btn sm" data-add="${k}">Ajouter</button></div></div>`;
  }
  h += '<p class="small muted">« Aménageable » : coché par défaut quand tu actives les aménagements d\'un élève. Un motif retiré reste visible dans l\'historique.</p></main>';
  mount(h, () => go({ name: 'home' }));
  $$('[data-set]').forEach((i) => { i.onchange = () => { s[i.dataset.set] = Math.max(Number(i.min), Math.min(Number(i.max), Math.round(Number(i.value) || Number(i.min)))); i.value = s[i.dataset.set]; save(); }; });
  $$('[data-txt]').forEach((i) => { i.onchange = () => { s[i.dataset.txt] = i.value.trim(); save(); }; });
  $$('input[name=vw]').forEach((r) => { r.onchange = () => { s.view = r.value; save(); }; });
  $$('[data-icon]').forEach((i) => { i.onchange = () => { motif(i.dataset.icon).icon = i.value.trim() || '•'; save(); }; });
  $$('[data-label]').forEach((i) => { i.onchange = () => { const v = i.value.trim(); if (v) { motif(i.dataset.label).label = v; save(); } }; });
  $$('[data-amen]').forEach((i) => { i.onchange = () => { motif(i.dataset.amen).amen = i.checked; save(); }; });
  $$('[data-hide]').forEach((b) => { b.onclick = () => { const m = motif(b.dataset.hide); if (!confirm(`Retirer le motif « ${m.label} » des boutons ?`)) return; if (S.events.some((e) => e.m === m.id)) m.hidden = true; else S.motifs = S.motifs.filter((x) => x !== m); save(); render(); }; });
  $$('[data-add]').forEach((b) => { b.onclick = () => { const k = b.dataset.add; const label = $(`[data-newlabel="${k}"]`).value.trim(); if (!label) return; S.motifs.push({ id: uid(), label, icon: $(`[data-newicon="${k}"]`).value.trim() || '•', kind: k, amen: false }); save(); render(); }; });
}

/* ----- Sécurité, sauvegarde, effacement ----- */
async function exportBackup() {
  await flush();
  const now = Date.now();
  S.lastBackup = now; await persist();
  const blob = new Blob([JSON.stringify({ app: 'maclasse', v: 1, date: now, keys: getKeys(), data: JSON.parse(ls.get(LS_DATA)) })], { type: 'application/json' });
  const d = new Date(now);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `maclasse-sauvegarde-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  fileOpUntil = Date.now() + 60000;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Sauvegarde créée. Range le fichier sur ton ordinateur ou une clé USB : il est chiffré avec ton code.');
  if (view.name === 'home' || view.name === 'securite') render();
}
function importFile(e) {
  const f = e.target.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o; try { o = JSON.parse(r.result); } catch (_) { o = null; }
    if (!o || o.app !== 'maclasse' || !o.keys?.w1 || !o.data?.ct) { alert('Ce fichier n\'est pas une sauvegarde de Ma classe.'); return; }
    if (hasKeys() && !confirm(`Remplacer toutes les données de cet appareil par la sauvegarde du ${dFull(o.date)} ? Il faudra le code utilisé au moment de cette sauvegarde.`)) return;
    if (S) { await flush(); }
    ls.set(LS_KEYS, JSON.stringify(o.keys)); ls.set(LS_DATA, JSON.stringify(o.data)); ls.del(LS_TRY);
    S = null; DK = null; RAW = null; closeSheet();
    view = { name: 'home', msg: `Sauvegarde du ${dFull(o.date)} restaurée. Entre le code de cette sauvegarde.` };
    render();
  };
  r.readAsText(f);
}
function renderSecurite() {
  const s = S.settings;
  let h = bar('Code et sauvegarde', () => go({ name: 'home' })) + '<main class="wrap">';
  h += `<h2>💾 Sauvegarde</h2><div class="box"><p class="small">${S.lastBackup ? `Dernière sauvegarde : ${dLong(S.lastBackup)}.` : 'Aucune sauvegarde pour l\'instant.'} Si l'appareil est perdu ou réinitialisé, c'est le seul moyen de tout retrouver. Le fichier est chiffré : il faut ton code pour l'ouvrir.</p>
    <div class="row"><button class="btn primary" id="x-save">Sauvegarder maintenant</button><label class="btn">Restaurer un fichier<input type="file" id="x-file" accept=".json,application/json" hidden></label></div></div>`;
  h += `<h2>🔒 Verrouillage</h2><div class="box"><label>Écran neutre après <select id="x-lock">${[1, 2, 3, 5, 10, 0].map((m) => `<option value="${m}"${s.lockMin === m ? ' selected' : ''}>${m ? m + ' min sans toucher l\'écran' : 'jamais (déconseillé)'}</option>`).join('')}</select></label>
    <p class="small muted">L'outil se verrouille aussi dès que tu changes d'appli ou que l'écran s'éteint, et avec 🔒 en haut.</p></div>`;
  h += `<h2>🔑 Changer de code</h2><div class="box"><form id="x-code"><label class="f"><span>Code actuel</span><input type="password" id="x-c0" autocomplete="current-password"></label><label class="f"><span>Nouveau code (6 caractères minimum)</span><input type="password" id="x-c1" autocomplete="new-password"></label><label class="f"><span>Retape le nouveau code</span><input type="password" id="x-c2" autocomplete="new-password"></label><p class="small" id="x-msg" style="color:var(--red)"></p><button class="btn">Changer</button></form>
    <p class="small muted">Code de secours perdu ? <button class="link small" id="x-rec">En créer un nouveau</button> (l'ancien ne marchera plus).</p></div>`;
  h += `<h2>🗑 Fin d'année</h2><div class="box"><p class="small">Le RGPD demande de ne pas garder ces notes plus longtemps que nécessaire. Fais une dernière sauvegarde si tu en as besoin, puis efface.</p>
    <div class="row"><button class="btn danger" id="x-ev">Effacer toutes les remarques et positifs</button><button class="btn danger" id="x-all">Tout effacer (classes, salles, code…)</button></div></div>`;
  h += `<h2>📱 Installer</h2><div class="box small"><p>Ajoute l'outil à l'écran d'accueil : dans le menu du navigateur, « Ajouter à l'écran d'accueil » (Android) ou bouton Partager → « Sur l'écran d'accueil » (iPad, iPhone). Il fonctionne ensuite sans internet.</p><p class="muted">Version ${APP_VERSION}</p></div>`;
  h += '</main>';
  mount(h, () => go({ name: 'home' }));
  $('#x-save').onclick = exportBackup;
  $('#x-file').onclick = () => { fileOpUntil = Date.now() + 120000; };
  $('#x-file').onchange = importFile;
  $('#x-lock').onchange = (e) => { s.lockMin = Number(e.target.value); save(); bump(); };
  $('#x-code').onsubmit = async (e) => {
    e.preventDefault();
    const m = $('#x-msg'), c1 = $('#x-c1').value.trim();
    if (c1.length < 6) { m.textContent = 'Le nouveau code doit faire au moins 6 caractères.'; return; }
    if (c1 !== $('#x-c2').value.trim()) { m.textContent = 'Les deux nouveaux codes ne sont pas identiques.'; return; }
    m.textContent = 'Vérification…';
    const keys = getKeys();
    try { await unwrapWith($('#x-c0').value.trim(), keys.w1); } catch (_) { m.textContent = 'Le code actuel est incorrect.'; return; }
    keys.w1 = await wrapWith(c1, RAW); ls.set(LS_KEYS, JSON.stringify(keys));
    m.textContent = ''; e.target.reset(); toast('Code changé. Pense à refaire une sauvegarde (les anciennes gardent l\'ancien code).');
  };
  $('#x-rec').onclick = async () => {
    if (!confirm('Créer un nouveau code de secours ? L\'ancien ne fonctionnera plus.')) return;
    const rec = genRecovery(); const keys = getKeys(); keys.w2 = await wrapWith(normRecovery(rec), RAW); ls.set(LS_KEYS, JSON.stringify(keys));
    openSheet(`<div class="sheet-h"><div><b>Nouveau code de secours</b></div><button class="ib" id="rc-x">✕</button></div><p>Note-le sur papier et range-le chez toi.</p><div class="recov">${rec}</div>`, (o) => { $('#rc-x', o).onclick = closeSheet; });
  };
  $('#x-ev').onclick = () => { if (!confirm('Effacer toutes les remarques et tous les positifs de toutes les classes ? (Les classes, salles et plans restent.)')) return; S.events = []; S.done = []; save(); toast('Remarques effacées.'); render(); };
  $('#x-all').onclick = () => { if (!confirm('Tout effacer sur cet appareil ? Classes, salles, plans, remarques et code. C\'est définitif.')) return; if (!confirm('Vraiment tout effacer ?')) return; ls.del(LS_KEYS); ls.del(LS_DATA); ls.del(LS_TRY); S = null; DK = null; RAW = null; view = { name: 'home' }; render(); };
}

/* ---------- Démarrage ---------- */
if (!window.crypto?.subtle) {
  app.innerHTML = '<div class="lock"><div class="box"><h2>Navigateur non compatible</h2><p>Ouvre cet outil depuis son adresse en <b>https://</b> avec un navigateur récent (Chrome, Safari, Firefox, Edge).</p></div></div>';
} else {
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible */ });
}
</script>
